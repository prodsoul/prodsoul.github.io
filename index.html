<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joann Bisseling | UX &amp; Game Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Libre+Franklin:wght@400;500;600;700&amp;display=swap"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #0D0D0D;
      --heading: #F2F2EF;
      --body-text: #CACACA;
      --blue: #397AFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--body-text);
      font-family: "Libre Franklin", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 3rem, 60rem);
      margin: 0 auto;
      padding: 16vh 0 4rem;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0 0 1.5rem;
      color: var(--blue);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--blue);
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--heading);
      font-family: "Libre Caslon Display", Georgia, serif;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 8vw, 6rem);
    }

    .intro {
      margin: 1rem 0 2rem;
    }

    a {
      color: var(--blue);
      font-weight: 500;
      text-underline-offset: 0.25em;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 4px;
    }

    button, input, select, textarea {
      font: inherit;
    }
  </style>
</head>

<body>
  <main>
    <p class="section-label">~/portfolio</p>
    <h1>Joann Bisseling</h1>
    <p class="intro">UX &amp; Game Design student in Singapore.</p>
    <a href="https://www.linkedin.com/in/joannbisseling/">LinkedIn ↗</a>
  </main>
</body>
</html>
