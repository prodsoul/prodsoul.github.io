<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joann Bisseling | UX &amp; Game Design</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&amp;family=Libre+Franklin:wght@400;500;600;700&amp;display=swap"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #141414;
      --body-text: #DADADA;
      --heading-blue: #BBD9FF;
      --link-blue: #82BAFF;
    }

    body {
      margin: 0;
      background-color: var(--background);
      color: var(--body-text);
      font-family: "Libre Franklin", Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 48rem;
      margin: 0 auto;
      padding: 16vh 1.5rem 4rem;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--heading-blue);
      font-family: "Libre Caslon Display", Georgia, serif;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 8vw, 5rem);
    }

    p {
      margin: 1rem 0 2rem;
    }

    a {
      color: var(--link-blue);
      text-underline-offset: 0.25em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    button, input, select, textarea {
      font: inherit;
    }
  </style>
</head>

<body>
  <main>
    <h1>Joann Bisseling</h1>
    <p>UX &amp; Game Design student in Singapore.</p>
    <a href="https://www.linkedin.com/in/joannbisseling/">LinkedIn</a>
  </main>
</body>
</html>
